<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" name="mobile-web-app-capable" content="yes">
    <title>席案内</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            width: 100vw;
            background: #f7f7fa;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* ← 上寄せに変更 */
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* ← 上寄せに変更 */
            background: #fff;
            border-radius: 0;
            box-shadow: none;
            padding-top: 6vh; /* ← 上に余白を追加（例: 6vh） */
            box-sizing: border-box;
        }
        h1 {
            color: #2d3e50;
            margin-bottom: 32px;
            font-size: 2.5em;
        }
        .result {
            margin-top: 24px;
            font-size: 2em;
            color: #333;
            background: #eaf6ff;
            border-radius: 16px;
            padding: 32px 48px;
            min-width: 320px;
        }
        .back-btn {
            margin-top: 40px;
            display: inline-block;
            padding: 18px 48px;
            background: #4f8cff;
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.3em;
            border: none;
            cursor: pointer;
        }
        .back-btn:hover {
            background: #357ae8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>席案内</h1>
        {% if seat_type and available_table_id %}
            <div class="result">
                <strong>{{ seat_type }}席（卓番号: {{ available_table_id }}）</strong>にご案内します。
            </div>
        {% elif seat_type %}
            <div class="result">
                <strong>{{ seat_type }}席</strong>は空いていません。
            </div>
        {% endif %}
        <a href="{{ url_for('select_people') }}" class="back-btn">戻る</a>
    </div>
    <script>
        // 2分（120秒）後に自動でトップページに戻る
        setTimeout(function() {
            window.location.href = "{{ url_for('select_people') }}";
        }, 60000);
    </script>
</body>
</html>
